# Written to /etc/nginx/qgis.d by qfastserver-start.sh when QFASTSERVER_GZIP is set.
# Responses of the text types are compressed for the clients which send "Accept-Encoding: gzip";
# images and other binary formats are sent as they are. text/html is always in the list of nginx.
gzip on;
gzip_types text/xml text/plain application/xml application/json application/geo+json application/vnd.geo+json application/gml+xml application/vnd.ogc.gml image/svg+xml;
gzip_min_length 1024;
# also when the request comes through a reverse proxy
gzip_proxied any;
gzip_vary on;
